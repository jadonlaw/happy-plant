<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Units test</title>
<style>
body{font-family:system-ui,Arial;background:#111;color:#eee;max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px}fieldset{border:1px solid #444;border-radius:12px;margin:12px 0;padding:12px}
input{display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border-radius:8px;border:1px solid #555;background:#222;color:#eee}
button{padding:10px 16px;border-radius:999px;border:0;background:#2f7d32;color:#fff;margin:4px 4px 0 0}
pre{background:#000;padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-word}
a{color:#8bc34a}
</style></head>
<body>
<h1>Happy Plant — units test page</h1>
<p>Log in first on <a href="/test/accounts">/test/accounts</a>.</p>

<fieldset><legend>Pair a Happy Plant</legend>
<input id="key" placeholder="HAPPY-XXXX-XXXX" autocapitalize="characters">
<button onclick="call('pair',{key:v('key')})">Pair</button>
</fieldset>

<fieldset><legend>My units</legend>
<button onclick="get('')">Show my units</button>
<input id="serial" placeholder="Serial to remove, e.g. HP-0001">
<button onclick="call(v('serial')+'/remove',{})">Remove device</button>
</fieldset>

<h2 style="font-size:16px">Server reply</h2><pre id="out">—</pre>
<script>
const v=id=>document.getElementById(id).value;
const csrf=()=>(document.cookie.match(/csrftoken=([^;]+)/)||[])[1]||'';
const show=async r=>{document.getElementById('out').textContent=r.status+'\n'+JSON.stringify(await r.json(),null,2)};
async function call(p,data){await fetch('/api/auth/csrf');show(await fetch('/api/units/'+p,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(data)}))}
async function get(p){show(await fetch('/api/units/'+p))}
</script>
</body></html>
